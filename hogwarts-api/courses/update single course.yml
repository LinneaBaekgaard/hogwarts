info:
  name: update single course
  type: http
  seq: 4

http:
  method: PUT
  url: http://localhost:3000/courses/1
  body:
    type: json
    data: |-
      {
        "id": 1,
        "name": "Transfiguration",
        "teacher": "Minerva McGonagall",
        "students": ["Harry Potter"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
